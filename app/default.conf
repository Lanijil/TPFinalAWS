server {
    listen 8080;
    server_name _;

    location / {
        root  /usr/share/nginx/html;
        index index.html;

        add_header X-Served-By $hostname always;
    }


    location /whoami {
        default_type text/plain;
        return 200 "$hostname\n";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
