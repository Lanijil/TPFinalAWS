server {
    listen 8080;
    server_name _;

    # Page applicative
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # Permet de voir quelle tache / quel pod a repondu
        add_header X-Served-By $hostname always;
    }

    # Identité de l'instance : sert a demontrer la repartition de charge
    location /whoami {
        default_type text/plain;
        return 200 "$hostname\n";
    }

    # Endpoint dedie aux sondes (ALB target group / readinessProbe K8s)
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
